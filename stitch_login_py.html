<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle glow effect for focused inputs */
        .input-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2);
        }

        /* Toast animation */
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-exit {
            animation: fadeOut 0.3s ease-out forwards;
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4 selection:bg-primary-container selection:text-on-primary-container relative overflow-hidden">
<!-- Ambient Background Effect (Subtle) -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-20">
<div class="w-[800px] h-[800px] bg-primary rounded-full blur-[150px] opacity-10"></div>
</div>
<!-- Error Toast 429 -->
<div class="toast-enter fixed top-6 right-6 z-50 flex items-center gap-3 bg-error-container border border-error/20 p-4 rounded-lg shadow-[0_10px_15px_-3px_rgba(0,0,0,0.5)] max-w-sm w-full" id="error-toast">
<span class="material-symbols-outlined text-on-error-container" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="flex-1">
<p class="font-label-sm text-label-sm text-on-error-container font-bold">Error 429</p>
<p class="font-body-md text-body-md text-on-error-container/90">Demasiados intentos, inténtalo más tarde.</p>
</div>
<button class="text-on-error-container/70 hover:text-on-error-container transition-colors p-1 rounded-DEFAULT hover:bg-on-error-container/10" onclick="dismissToast()">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Main Login Card -->
<main class="w-full max-w-[420px] bg-surface-container border border-outline-variant rounded-xl shadow-[0_20px_40px_-10px_rgba(0,0,0,0.7)] relative z-10 flex flex-col backdrop-blur-xl backdrop-filter">
<!-- Header -->
<div class="p-8 pb-6 text-center border-b border-outline-variant/50">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-2">BackRoom</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Accede a tu espacio de control</p>
</div>
<!-- Body -->
<div class="p-8 flex flex-col gap-6">
<!-- OAuth Providers -->
<div class="flex flex-col gap-3">
<button class="flex items-center justify-center gap-3 w-full p-3 rounded-lg border border-outline-variant bg-transparent hover:bg-surface-container-high transition-colors text-on-surface font-label-sm text-label-sm active:scale-[0.98]">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24"><path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"></path><path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path><path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path><path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26537 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853"></path></svg>
                    Continuar con Google
                </button>
<button class="flex items-center justify-center gap-3 w-full p-3 rounded-lg border border-outline-variant bg-transparent hover:bg-surface-container-high transition-colors text-on-surface font-label-sm text-label-sm active:scale-[0.98]">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewbox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
                    Continuar con GitHub
                </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">o con tu correo</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Form -->
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Correo electrónico</label>
<div class="relative input-glow rounded-lg transition-shadow">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-2.5 pl-10 pr-4 text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-0 transition-colors" id="email" placeholder="tu@empresa.com" type="email" value="admin@backroom.local"/>
</div>
</div>
<!-- Password Input (Error State Example) -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-error" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative input-glow rounded-lg transition-shadow">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-error text-[20px]">lock</span>
<input class="w-full bg-surface border border-error rounded-lg py-2.5 pl-10 pr-10 text-error font-body-md text-body-md focus:border-error focus:ring-0 transition-colors" id="password" placeholder="••••••••" type="password" value="••••••••"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility_off</span>
</button>
</div>
<!-- Inline Error Message -->
<p class="font-label-sm text-label-sm text-error flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[14px]">error</span>
                        Credenciales incorrectas. Intenta de nuevo.
                    </p>
</div>
<!-- Submit Button -->
<button class="mt-2 w-full bg-primary-container text-on-primary-container hover:bg-primary-container/90 font-label-sm text-label-sm font-bold py-3 px-4 rounded-lg transition-all active:scale-[0.98] shadow-[0_4px_12px_rgba(124,58,237,0.2)] flex items-center justify-center gap-2" type="submit">
                    Iniciar sesión
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer -->
<div class="p-6 bg-surface-container-high/50 border-t border-outline-variant rounded-b-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tienes una cuenta? 
                <a class="text-primary hover:text-primary-container font-semibold transition-colors" href="#">Crear una cuenta</a>
</p>
</div>
</main>
<!-- Scripts for interaction -->
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                eyeIcon.textContent = 'visibility_off';
            }
        }

        function dismissToast() {
            const toast = document.getElementById('error-toast');
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => {
                toast.style.display = 'none';
            }, 300);
        }

        // Auto-dismiss toast after 5 seconds for demonstration
        setTimeout(() => {
            if(document.getElementById('error-toast').style.display !== 'none') {
                dismissToast();
            }
        }, 5000);
    </script>
</body></html>
