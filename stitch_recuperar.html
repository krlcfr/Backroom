<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recuperar Contraseña - BackRoom</title>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Decorative background elements -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-container opacity-[0.03] blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-primary opacity-[0.02] blur-[80px]"></div>
<!-- Grid pattern -->
<div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px]"></div>
</div>
<!-- Main Card -->
<div class="relative z-10 w-full max-w-md bg-surface-container-high border border-outline-variant rounded-xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.5)] overflow-hidden">
<!-- Top accent bar -->
<div class="h-1 w-full bg-primary-container"></div>
<div class="p-8">
<!-- Header -->
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface border border-outline-variant mb-4">
<span class="material-symbols-outlined text-primary text-2xl">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Recuperar contraseña</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Introduce tu email para recibir un enlace de recuperación.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Success Message (Hidden by default, shown for demonstration) -->
<div class="bg-primary-container/10 border border-primary/20 rounded-lg p-4 flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-lg mt-0.5">info</span>
<p class="font-body-md text-body-md text-primary-fixed-dim">
                        Si el correo existe, recibirás instrucciones para restablecer tu contraseña.
                    </p>
</div>
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="email">Dirección de Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[18px]">mail</span>
</span>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md placeholder:text-outline focus:ring-1 focus:ring-primary focus:border-primary focus:outline-none transition-colors" id="email" name="email" placeholder="admin@acmecorp.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center py-2.5 px-4 bg-primary-container hover:bg-[#8B5CF6] text-[#FAFAFA] font-label-sm text-label-sm rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="submit">
                    Enviar enlace de recuperación
                    <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Volver al login
                </a>
</div>
</div>
</div>
</body></html>
